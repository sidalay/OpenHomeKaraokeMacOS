<style>
  /* The queue: a plain list. Admins reorder it by dragging a song: on a phone, press and
     hold a song for a moment, then drag (a quick swipe still scrolls); with a mouse, just
     drag. Themes restyle the colours in static/themes/theme.css. */
  .content ol.queue-list { list-style: none; margin: 0 0 0.6em; padding: 0; }
  .content .queue-list li + li { margin-top: 0; }
  .queue-item {
    display: flex; align-items: center; gap: 0.75em;
    padding: 0.7em 0.8em; margin-bottom: 6px; border-radius: 12px;
    background: rgba(127, 127, 127, 0.12);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .queue-num { flex: none; width: 1.6em; text-align: right; opacity: 0.55; font-variant-numeric: tabular-nums; }
  .queue-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .queue-title { overflow-wrap: anywhere; }
  .queue-user { font-size: 0.8em; font-weight: 600; }
  .queue-delete { flex: none; padding: 0.3em 0.2em; }
  .queue-list.sortable .queue-item { cursor: grab; }
  .queue-list.sorting .queue-item { transition: transform 0.18s ease; }
  .queue-list.sorting .queue-item.lifted {
    transition: none; position: relative; z-index: 5; cursor: grabbing;
    background: #464f51; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
  }
  .queue-hint { font-size: 0.8em; opacity: 0.6; margin: 0 0 1em; }
</style>

<header class="title">
<h1 class>{{getString1(112)}}</h1>
</header>

<div class="content">

<ol class="queue-list" id="queue-list"></ol>
{% if admin %}<p class="queue-hint" id="queue-hint" style="display: none">{{getString1(247)}}</p>{% endif %}

<a class="add-random has-text-success" onclick="get_refresh('/queue/addrandom?amount=3')">
  <i class="icon icon-plus-circled"></i>{{getString1(109)}}
</a>

{% if admin %}
<a class="has-text-danger is-pulled-right" onclick="clearAll()">
  <i class="icon icon-trash-empty"></i>{{getString1(110)}}
</a><br />
{% endif %}
</div>

<script>
var queue = [];
var qdrag = null;          // the song being dragged, if any
var qpending = null;       // a queue update that arrived mid-drag

function update(data) {
	if (!data) return;
	if (qdrag) { qpending = data; return; }     // don't pull the list out from under a finger
	try { queue = JSON.parse(data); }
	catch { console.log(`JSON parse error: ${data}`); return; }
	renderQueue();
}

function getQueue() {
	if (!qdrag) $.get('/get_queue').done(update);
}

function escapeHTML(s) {
	return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

function renderQueue() {
	var list = document.getElementById('queue-list');
	$('#queue-hint').toggle(queue.length > 1);
	if (!queue.length) {
		list.innerHTML = `<li class="has-text-warning">{{getString1(111)}}</li>`;
		return;
	}
	list.innerHTML = queue.map((e, index) => `
		<li class="queue-item">
			<span class="queue-num">${index + 1}</span>
			<span class="queue-text">
				<span class="queue-title">${escapeHTML(e.title)}</span>
				<span class="queue-user has-text-success">${escapeHTML(e.user)}</span>
			</span>
			{% if admin %}
			<a class="queue-delete has-text-danger" data-file="${escapeHTML(e.file)}"
				title="{{getString1(113)}} ${escapeHTML(e.title)}"><i class="icon icon-trash-empty"></i></a>
			{% endif %}
		</li>`).join('');
}

function clearAll() {
	if(confirm("{{getString1(108)}}")) $.get("/queue/edit?action=clear");
}

{% if admin %}
$('#queue-list').on('click', '.queue-delete', function () {
	get_refresh('/queue/edit?action=delete&song=' + encodeURIComponent(this.dataset.file));
});

// Drag to reorder. Written with plain touch/mouse events rather than jQuery UI sortable:
// with touch-punch, sortable blocks page scrolling wherever it is enabled, which is why
// dragging used to work only from the little arrow cells.
(function () {
	var HOLD_MS = 250;      // phones: hold this long to pick a song up; moving sooner scrolls
	var SLOP = 8;           // px of movement that turns a press into a scroll (or a mouse drag)
	var EDGE = 70;          // px from the top/bottom of the screen where dragging scrolls the page
	var list = document.getElementById('queue-list');
	var press = null, lastY = 0, scrolling = null;

	list.classList.add('sortable');
	list.addEventListener('contextmenu', e => { if (press || qdrag) e.preventDefault(); });   // Android long-press menu
	list.addEventListener('touchstart', begin, {passive: true});
	list.addEventListener('mousedown', begin);

	function pointer(e) { var t = e.touches ? e.touches[0] : e; return {x: t.clientX, y: t.clientY}; }

	function begin(e) {
		var item = e.target.closest('.queue-item');
		if (!item || e.target.closest('.queue-delete') || (e.type == 'mousedown' && e.button !== 0)) return;
		var p = pointer(e), touch = e.type == 'touchstart';
		press = {item: item, x: p.x, y: p.y, touch: touch};
		if (touch) press.timer = setTimeout(() => pickUp(p.y), HOLD_MS);
		// listen on the document only while pressed (this pane's script runs again each visit)
		document.addEventListener(touch ? 'touchmove' : 'mousemove', move, {passive: false});
		document.addEventListener(touch ? 'touchend' : 'mouseup', end);
		if (touch) document.addEventListener('touchcancel', end);
	}

	function move(e) {
		var p = pointer(e);
		lastY = p.y;
		if (qdrag) { e.preventDefault(); dragTo(p.y); return; }
		if (!press || Math.hypot(p.x - press.x, p.y - press.y) <= SLOP) return;
		if (press.touch) { cancelPress(); return; }            // moved before the hold: a scroll
		pickUp(press.y); dragTo(p.y);                          // mouse: drag right away
	}

	function end() {
		cancelPress();
		if (qdrag) drop();
	}

	function cancelPress() {
		if (!press) return;
		clearTimeout(press.timer);
		document.removeEventListener(press.touch ? 'touchmove' : 'mousemove', move, {passive: false});
		document.removeEventListener(press.touch ? 'touchend' : 'mouseup', end);
		document.removeEventListener('touchcancel', end);
		if (!qdrag) press = null;
	}

	function pickUp(y) {
		var items = [].slice.call(list.children), from = items.indexOf(press.item);
		if (from < 0) return;
		// positions in page coordinates, so scrolling while dragging keeps them valid
		var tops = items.map(el => el.getBoundingClientRect().top + window.scrollY);
		var heights = items.map(el => el.getBoundingClientRect().height);
		var gap = items.length > 1 ? tops[1] - tops[0] - heights[0] : 6;
		qdrag = {item: press.item, items: items, from: from, to: from, tops: tops, heights: heights,
		         slot: heights[from] + gap, startY: y + window.scrollY};
		list.classList.add('sorting');
		press.item.classList.add('lifted');
		if (navigator.vibrate) navigator.vibrate(15);
		lastY = y;
		autoScroll();
	}

	function dragTo(y) {
		var d = qdrag, dy = y + window.scrollY - d.startY;
		d.item.style.transform = `translateY(${dy}px)`;
		var centre = d.tops[d.from] + d.heights[d.from] / 2 + dy, to = d.from;
		d.items.forEach((el, i) => {
			if (i == d.from) return;
			var c = d.tops[i] + d.heights[i] / 2, shift = 0;
			if (i < d.from && centre < c) { shift = d.slot; to--; }        // moves down to make room
			if (i > d.from && centre > c) { shift = -d.slot; to++; }       // moves up
			el.style.transform = shift ? `translateY(${shift}px)` : '';
		});
		d.to = to;
	}

	function autoScroll() {
		if (!qdrag) return;
		var h = window.innerHeight, step = 0;
		if (lastY < EDGE) step = -Math.ceil((EDGE - lastY) / 6);
		else if (lastY > h - EDGE) step = Math.ceil((lastY - (h - EDGE)) / 6);
		if (step) { window.scrollBy(0, step); dragTo(lastY); }
		requestAnimationFrame(autoScroll);
	}

	function drop() {
		var d = qdrag;
		qdrag = null;
		press = null;
		d.items.forEach(el => { el.style.transform = ''; });
		d.item.classList.remove('lifted');
		list.classList.remove('sorting');
		if (d.to != d.from) {
			var size = queue.length;
			queue.splice(d.to, 0, queue.splice(d.from, 1)[0]);    // show the new order right away
			renderQueue();
			$.get(`/queue/edit?action=move&from=${d.from}&to=${d.to}&size=${size}`);
			qpending = null;         // stale now; the server sends the new queue after the move
		} else if (qpending) {
			var data = qpending; qpending = null; update(data);
		}
	}
})();
{% endif %}

//on page load
getQueue();
</script>
